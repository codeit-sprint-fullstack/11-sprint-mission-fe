<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓</title>
    <link rel="stylesheet" href="../styles/reset.css" />
    <link rel="stylesheet" href="../styles/mainstyle.css" />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
  </head>
  <body>
    <header>
      <a href="./">
        <img src="../images/mission1/panda.svg" alt="판다마켓 로고" />
        <h1 class="sr-only">판다마켓 메인 페이지</h1>
      </a>
      <a class="login-btn" href="login.html">로그인</a>
    </header>

    <section id="hero">
      <div class="wrap">
        <div class="container">
          <h2>
            일상의 모든 물건을
            <br />
            거래해 보세요
          </h2>
          <a href="items.html">구경하러 가기</a>
        </div>
        <img
          id="hero_panda"
          src="../images/mission1/Img_home_top.png"
          alt="장바구니를 들고 있는 판다"
        />
      </div>
    </section>

    <main>
      <div class="box">
        <div class="inner_box">
          <img src="../images/mission1/Img_home_01.png" alt="인기상품확인" />
          <div class="ex_box">
            <p class="badge">Hot item</p>
            <h2>
              인기 상품을
              <br />
              확인해 보세요
            </h2>
            <p class="explanation">
              가장 HOT한 중고거래 물품을
              <br />
              판다 마켓에서 확인해 보세요
            </p>
          </div>
        </div>
      </div>

      <div class="box">
        <div class="inner_box flex-row-reverse">
          <img src="../images/mission1/Img_home_02.png" alt="인기상품확인" />
          <div class="ex_box">
            <p class="badge">Search</p>
            <h2>
              구매를 원하는
              <br />
              상품을 검색하세요
            </h2>
            <p class="explanation">
              구매하고 싶은 물품은 검색해서
              <br />
              쉽게 찾아보세요
            </p>
          </div>
        </div>
      </div>

      <div class="box">
        <div class="inner_box">
          <img src="../images/mission1/Img_home_03.png" alt="인기상품확인" />
          <div class="ex_box">
            <p class="badge">Register</p>
            <h2>
              판매를 원하는
              <br />
              상품을 등록하세요
            </h2>
            <p class="explanation">
              어떤 물건이든 판매하고 싶은 상품을
              <br />
              쉽게 등록하세요
            </p>
          </div>
        </div>
      </div>
    </main>

    <section id="bottom">
      <div class="wrap">
        <div class="container">
          <h2>
            믿을 수 있는
            <br />
            판다마켓 중고 거래
          </h2>
        </div>
        <img
          id="bottom_panda"
          src="../images/mission1/Img_home_bottom.png"
          alt="장바구니를 들고 서로 인사하는 두 마리 판다"
        />
      </div>
    </section>

    <footer>
      <div class="bar">
        <p class="copyright">©codeit - 2024</p>

        <div class="policy_faq">
          <a href="privacy.html">
            <p>Privacy Policy</p>
          </a>
          <a href="faq.html">
            <p>FAQ</p>
          </a>
        </div>

        <ul class="icon">
          <li>
            <a href="https://www.facebook.com/" target="_blank">
              <img
                src="../images/mission1/ic_facebook.svg"
                alt="페이스북 로고"
              />
            </a>
          </li>
          <li>
            <a href="https://x.com/" target="_blank">
              <img src="../images/mission1/ic_twitter.svg" alt="트위터 로고" />
            </a>
          </li>
          <li>
            <a href="https://www.youtube.com/" target="_blank">
              <img src="../images/mission1/ic_youtube.svg" alt="유튜브 로고" />
            </a>
          </li>
          <li>
            <a href="https://www.instagram.com/" target="_blank">
              <img
                src="../images/mission1/ic_instagram.svg"
                alt="인스타그램 로고"
              />
            </a>
          </li>
        </ul>
      </div>
    </footer>
  </body>
</html>
