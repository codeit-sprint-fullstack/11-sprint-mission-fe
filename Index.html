<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓</title>
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <link rel="stylesheet" href="styles/reset.css" />
    <link rel="stylesheet" href="styles/style.css" />
    <link rel="icon" href="imgs\favicon.ico" />
  </head>
  <body>
    <!-- 각각의 태그에는 의미가 있고, 목적이 있다. -라이브코딩-->
    <header>
      <a href="Index.html">
        <img src="imgs\logo.svg" alt="판다마켓 로고" />
      </a>

      <a id="login-btn" href="/login.html">로그인</a>
    </header>
    <main>
      <section id="hero">
        <div class="container">
          <h1>
            일상의 모든 물건을
            <br />
            거래해 보세요
          </h1>
          <a href="/items.html">구경하러 가기</a>
        </div>
      </section>

      <!-- 여기까지 1차 라이브 코딩 내용 -->

      <section id="homes">
        <section class="home1">
          <img src="imgs\Img_home_01.png" alt="인기 상품 확인" />
          <div class="home-wrapper1">
            <div class="home-head">Hot item</div>

            <div class="home-body">
              <h1>
                인기 상품을
                <br />
                확인해 보세요
              </h1>
            </div>

            <div class="home-foot">
              가장 HOT한 중고거래 물품을
              <br />
              판다 마켓에서 확인해 보세요
            </div>
          </div>
        </section>

        <section class="home2">
          <div class="home-wrapper2">
            <div class="home-head">Search</div>

            <div class="home-body">
              <h1>
                구매를 원하는
                <br />
                상품을 검색하세요
              </h1>
            </div>

            <div class="home-foot">
              구매하고 싶은 물품은 검색해서
              <br />
              쉽게 찾아보세요
            </div>
          </div>
          <img src="imgs\Img_home_02.png" alt="인기 상품 검색" />
        </section>

        <section class="home3">
          <img src="imgs\Img_home_03.png" alt="판매 상품 등록" />
          <div class="home-wrapper3">
            <div class="home-head">Register</div>

            <div class="home-body">
              <h1>
                판매를 원하는
                <br />
                상품을 등록하세요
              </h1>
            </div>

            <div class="home-foot">
              어떤 물건이든 판매하고 싶은 상품을
              <br />
              쉽게 등록하세요
            </div>
          </div>
        </section>
      </section>
      <footer id="body-bottom">
        <div class="container2">
          <h1>
            믿을 수 있는
            <br />
            판다마켓 중고 거래
          </h1>
        </div>
        <img src="imgs\Img_home_bottom.png" alt="믿을 수 있는 중고마켓" />
      </footer>
    </main>

    <footer>
      <div>©codeit - 2024</div>
      <div id="footerMenu">
        <a href="privacy.html">Privacy Policy</a>
        <a href="faq.html">FAQ</a>
      </div>
      <div id="socialMedia">
        <a href="https://www.facebook.com/">
          <img src="imgs\ic_facebook.png" alt="페이스북" width="20" />
        </a>

        <a href="https://twitter.com/">
          <img src="imgs\ic_twitter.png" alt="트위터" width="20" />
        </a>

        <a href="https://www.youtube.com/">
          <img src="imgs\ic_youtube.png" alt="유튜브" width="20" />
        </a>

        <a href="https://www.instagram.com/">
          <img src="imgs\ic_instagram.png" alt="인스타그램" width="20" />
        </a>
      </div>
    </footer>

</html>
