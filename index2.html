<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓</title>
    <link rel="stylesheet" href="./styles/reset.css" />
    <link rel="stylesheet" href="./styles/style.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/pretendard@latest/dist/web/static/pretendard.css"
    />
  </head>
  <body>
    <header>
      <a href="/">
        <img src="/images/pandalogo.svg" />
      </a>
      <a class="button login-button" href="/login.html">로그인</a>
    </header>

    <main>
      <section id="hero-banner">
        <div class="inner">
          <div class="hero-text">
            <h1>
              일상의 모든 물건을
              <br />
              거래해 보세요
            </h1>
            <a class="button hero-button" href="./items.html">구경하러 가기</a>
          </div>
          <div class="hero-img">
            <img src="/images/herobanner.png" />
          </div>
        </div>
      </section>

      <section id="features">
        <div class="feature">
          <div class="feature-inner">
            <div class="feature-img">
              <img src="./images/img1.png" alt="인기상품 확인" />
            </div>
            <div class="feature-text">
              <h2>Hot item</h2>
              <h1>
                인기 상품을
                <br />
                확인해 보세요
              </h1>
              <p>
                가장 HOT한 중고거래 물품을
                <br />
                판다 마켓에서 확인해 보세요
              </p>
            </div>
          </div>
        </div>
        <div class="feature">
          <div class="feature-inner">
            <div class="feature-text">
              <h2>Search</h2>
              <h1>
                구매를 원하는
                <br />
                상품을 검색하세요
              </h1>
              <p>
                구매하고 싶은 물품은 검색해서
                <br />
                쉽게 찾아보세요
              </p>
            </div>
            <div class="feature-img">
              <img src="./images/img2.png" alt="상품 검색" />
            </div>
          </div>
          </div>
        </div>
        <div class="feature">
          <div class="feature-inner">
            <div class="feature-img">
              <img src="./images/img3.png" alt="상품 등록" />
            </div>
            <div class="feature-text">
              <h2>Register</h2>
              <h1>
                판매를 원하는
                <br />
                상품을 등록하세요
              </h1>
              <p>
                어떤 물건이든 판매하고 싶은 상품을
                <br />
                쉽게 등록하세요
              </p>
            </div>
          </div>
        </div>
      </section>
      <section id="hero-banner">
        <div class="inner">
          <div class="hero-text">
            <h1>
              믿을 수 있는
              <br />
              판다마켓 중고 거래
            </h1>
          </div>
          <div class="hero-img">
            <img src="/images/bottombanner.png" />
          </div>
        </div>
      </section>
    </main>

    <footer>
      <div id="footer">
        <div class="footer-inner">
          <div class="footer-left">
            <p>©codeit - 2024</p>
          </div>
          <div class="footer-middle">
            <p>Privacy  Policy</p>
            <p>FAQ</p>
          </div>
          <div class="footer-right">
            <img src="/images/ic_facebook.png"/>
            <img src="/images/ic_twitter.png"/>
            <img src="/images/ic_youtube.png"/>    
            <img src="/images/ic_instagram.png"/> 
          </div>
        </div>
      </div>
      
    </footer>
  </body>
</html>
