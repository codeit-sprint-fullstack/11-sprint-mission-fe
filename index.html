<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>판다마켓</title>
    <link rel="icon" href="images/favicon.ico" />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <link rel="stylesheet" href="/css/reset.css" />
    <link rel="stylesheet" href="/css/style.css" />
    <!-- Google tag (gtag.js) -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-67JBD32GZW"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag('js', new Date());

      gtag('config', 'G-67JBD32GZW');

  </head>

  <body>
    <header>
      <div class="container">
        <a href="/">
          <img src="./images/Group 19.svg" alt="판다마켓 홈으로" />
        </a>
        <a href="/login.html" id="login-button" class="button">로그인</a>
      </div>
    </header>

    <main>
      <section id="top" class="banners">
        <div class="cont">
          <div class="banner">
            <h1>
              일상의 모든 물건을
              <br />
              거래해보세요
            </h1>
            <a href="/items.html" id="look-button" class="button">
              구경하러 가기
            </a>
          </div>
          <div id="img1" class="imgs"></div>
        </div>
      </section>

      <section class="feature">
        <div class="content">
          <img
            src="./images/Img_home_01.svg"
            alt="인기 상품"
            class="section-img"
          />
          <div class="description">
            <h2 class="tag">Hot item</h2>
            <h1 class="sum">
              인기 상품을
              <br />
              확인해 보세요
            </h1>
            <p>
              가장 HOT한 중고거래 물품을
              <br />
              판 마켓에서 확인해 보세요
            </p>
          </div>
        </div>
      </section>

      <section class="feature">
        <div class="content">
          <div class="description">
            <h2 class="tag">Search</h2>
            <h1 class="sum">
              구매를 원하는
              <br />
              상품을 검색하세요
            </h1>
            <p>
              구매하고 싶은 물품은 검색해서
              <br />
              쉽게 찾아보세요
            </p>
          </div>
          <img src="./images/Img_home_02.svg" alt="검색" class="section-img" />
        </div>
      </section>

      <section class="feature">
        <div class="content">
          <img src="./images/Img_home_03.svg" alt="등록" class="section-img" />
          <div class="description">
            <h2 class="tag">register</h2>
            <h1 class="sum">
              판매를 원하는
              <br />
              상품을 등록하세요
            </h1>
            <p>
              어떤 물건이든 판매하고 싶은 상품을
              <br />
              쉽게 등록하세요
            </p>
          </div>
        </div>
      </section>

      <section id="bottom" class="banners">
        <div class="cont">
          <h1>
            믿을 수 있는
            <br />
            판다마켓 중고거래
          </h1>
          <div id="img2" class="imgs"></div>
        </div>
      </section>
    </main>

    <footer>
      <div class="foot">
        <div class="codeit-foot">@codeit-2024</div>
        <div class="footermenu">
          <a href="/privacy.html">PrivacyPolicy</a>
          <a href="/faq.html">FAQ</a>
        </div>
        <div class="social-site">
          <a href="https://www.facebook.com/">
            <img
              src="/images/icon/facebook.svg"
              alt="페이스북"
              target="blank"
            />
          </a>
          <a href="https://www.twitter.com/">
            <img
              src="/images/icon/ic_twitter.svg"
              alt="트위터"
              target="blank"
            />
          </a>
          <a href="https://www.youtube.com/">
            <img src="/images/icon/youtube.svg" alt="유튜브" target="blank" />
          </a>
          <a href="https://www.instagram.com/">
            <img
              src="/images/icon/ic_instagram.svg"
              alt="인스타그램"
              target="blank"
            />
          </a>
        </div>
      </div>
    </footer>
  </body>
</html>
