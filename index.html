<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓</title>
    <link rel="stylesheet" as="style" crossorigin href="" />
    <link rel="stylesheet" href="./styles/reset.css" />
    <link rel="stylesheet" href="./styles/main.css" />
  </head>
  <body>
    <header>
      <nav class="nav-bar">
        <a class="logo-btn" href="/">
          <img src="./imgs/logo.svg" alt="판다마켓 로고" />
        </a>
        <a class="login-btn" href="./login.html">로그인</a>
      </nav>
    </header>
    <main>
      <section class="top-wrapper">
        <div class="top">
          <div>
            <h2>
              일상의 모든 물건을
              <br />
              거래해 보세요
            </h2>
            <a class="market-btn" href="./items.html">구경하러 가기</a>
          </div>
          <img src="./imgs/Img_home_top.svg" alt="장바구니를 들고 있는 판다" />
        </div>
      </section>
      <section class="features">
        <div class="feature-container">
          <div class="feature">
            <img src="./imgs/Img_home_01.svg" alt="인기 상품" />
            <div class="feature-content hot-item">
              <span>Hot item</span>
              <h2>
                인기 상품을
                <br />
                확인해 보세요
              </h2>
              <p>
                가장 HOT한 중고거래 물품을
                <br />
                판다 마켓에서 확인해 보세요
              </p>
            </div>
          </div>
        </div>
        <div class="feature-container">
          <div class="feature row-reverse">
            <img src="./imgs/Img_home_02.svg" alt="인기 상품" />
            <div class="feature-content search">
              <span>search</span>
              <h2>
                구매를 원하는
                <br />
                상품을 검색하세요
              </h2>
              <p>
                구매하고 싶은 물품은 검색해서
                <br />
                쉽게 찾아보세요
              </p>
            </div>
          </div>
        </div>
        <div class="feature-container">
          <div class="feature">
            <img src="./imgs/Img_home_03.svg" alt="인기 상품" />
            <div class="feature-content register">
              <span>register</span>
              <h2>
                판매를 원하는
                <br />
                상품을 등록하세요
              </h2>
              <p>
                어떤 물건이든 판매하고 싶은 상품을
                <br />
                쉽게 등록하세요
              </p>
            </div>
          </div>
        </div>
      </section>
      <section class="bottom-wrapper">
        <div class="bottom">
          <div>
            <h2>
              믿을 수 있는
              <br />
              판다마켓 중고 거래
            </h2>
          </div>
          <img
            src="./imgs/Img_home_bottom.svg"
            alt="장바구니를 들고 서로 인사하는 두 마리의 판다"
          />
        </div>
      </section>
    </main>
    <footer>
      <div class="footer-box">
        <span>◎codeit - 2024</span>
        <div class="footer-links">
          <a href="/privacy.html">Privacy Policy</a>
          <a href="/faq.html">FAQ</a>
        </div>
        <ul class="footer-icons">
          <li>
            <a target="_blank" href="https:www.facebook.com/">
              <img src="./imgs/ic_facebook.svg" alt="" />
            </a>
          </li>
          <li>
            <a target="_blank" href="https://x.com/">
              <img src="./imgs/ic_twitter.svg" alt="" />
            </a>
          </li>
          <ll>
            <a target="_blank" href="https://www.youtube.com/">
              <img src="./imgs/ic_youtube.svg" alt="" />
            </a>
          </ll>
          <li>
            <a target="_blank" href="https://www.instagram.com/">
              <img src="./imgs/ic_instagram.svg" alt="" />
            </a>
          </li>
        </ul>
      </div>
    </footer>
    <script type="module" src="main.js"></script>
  </body>
</html>
