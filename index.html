<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./reset.css" />
    <link rel="stylesheet" href="./style.css" />
    <link rel="icon" href="/images/favicon.svg" />

    <title>판다마켓</title>
  </head>
  <body>
    <header class="header">
      <div class="header_container">
        <img src="./images/headerLogo.png" alt="판다마켓 header 이미지" " />
        <a href="./login.html" class="login_button">로그인</a>
      </div>
    </header>

    <main class="main">
      <section class="banner">
        <div class="banner_container">
          <div>
            <h1 class="main_heading">
              일상의 모든 물건을
              <br />

              거래해 보세요
            </h1>

            <a href="/items" class="go_button">구경하러 가기</a>
          </div>
          <img
            src="./images/panda_image_banner1.png"
            alt="배너 판다 그림"
            class="panda_image_banner1"
          />
        </div>
      </section>
      <!-- 3개로 묶은 본문 상자  -->
      <section class="middle_content banner_margin">
        <div class="content-wrapper">
          <img src="./images/hot_item.png" class="content_image" />

          <div class="content-container">
            <span class="tag">Hot item</span>
            <h2 class="heading">
              인기 상품을
              <br />
              확인해 보세요
            </h2>
            <p class="description">
              가장 HOT한 중고거래 물품을
              <br />
              판다 마켓에서 확인해 보세요
            </p>
          </div>
        </div>
      </section>
      <section class="middle_content">
        <div class="content-wrapper">
          <div class="content-container content_align">
            <span class="tag">Search</span>
            <h2 class="heading">
              구매를 원하는
              <br />
              상품을 검색하세요
            </h2>
            <p class="description">
              구매하고 싶은 물품은 검색해서
              <br />
              쉽게 찾아보세요
            </p>
          </div>

          <img src="./images/search.png" class="content_image" />
        </div>
      </section>
      <section class="middle_content">
        <div class="content-wrapper">
          <img src="./images/register.png.png" class="content_image" />
          <div class="content-container">
            <span class="tag">Register</span>
            <h2 class="heading">
              판매를 원하는
              <br />
              상품을 등록하세요
            </h2>
            <p class="description">
              어떤 물건이든 판매하고 싶은 상품을
              <br />
              쉽게 등록하세요
            </p>
          </div>
        </div>
      </section>
      <!-- 3개로 묶은 본문 상자 끝  -->
      <section class="banner">
        <div class="banner_container">
          <h1 class="main_heading">
            믿을 수 있는
            <br />
            판다마켓 중고 거래
          </h1>

          <img
            src="./images/section5.png"
            alt="section 5 배너 판다 그림"
            class="panda_image_banner2"
          />
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="footer_container">
        <p class="footer_1">©codeit - 2024</p>
        <div class="privacy_policy_FAQ">
          <a href="./privacy.html" class="footer_2">Privacy Policy</a>
          <a href="./faq.html" class="footer_3">FAQ</a>
        </div>
        <div class="footer_4">
          <a href="https://www.facebook.com/" target="_blank">
            <img src="./images/footer.facebook.png" alt="facebook" />
          </a>
          <a href="https://x.com/" target="_blank">
            <img src="./images/footer.twitter.png" alt="twitter" />
          </a>
          <a href="https://www.youtube.com/" target="_blank">
            <img src="./images/footer.youtube.png" alt="youtube" />
          </a>
          <a href="https://www.instagram.com/" target="_blank">
            <img src="./images/footer.instagram.png" alt="instagram" />
          </a>
        </div>
      </div>
    </footer>
    <script defer type="module" src="./main.js"></script>
  </body>
</html>
