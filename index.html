<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓</title>
    <link rel="stylesheet" href="reset.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <a href="/">
        <img src="./imgs/logo.svg" alt="판다마켓 로고" />
      </a>
      <a class="login-btn" href="/login.html">로그인</a>
    </header>
    <main>
      <section id="banner-top">
        <div class="box">
          <h1>
            일상의 모든 물건을
            <br />
            거래해 보세요
          </h1>
          <a class="item-btn" href="/items.html">구경하러가기</a>
        </div>
      </section>
      <section class="section">
        <div class="container">
          <img class="img" src="./imgs/Img_home_01.svg" />
          <div class="frame-1">
            <p class="keyword">Hot item</p>
            <div class="frame2">
              <h2 class="content">
                인기 상품을
                <br />
                확인해 보세요
              </h2>
              <p class="content2">
                가장 HOT한 중고거래 물품을
                <br />
                판다 마켓에서 확인해 보세요
              </p>
            </div>
          </div>
        </div>
      </section>
      <section class="section">
        <div class="container">
          <div class="frame-2">
            <p class="keyword">Search</p>
            <div class="frame2">
              <h2 class="content-2">
                구매를 원하는
                <br />
                상품을 검색하세요
              </h2>
              <p class="content2-2">
                구매하고 싶은 물품은 검색해서
                <br />
                쉽게 찾아보세요
              </p>
            </div>
          </div>
          <img class="img" src="./imgs/Img_home_02.svg" />
        </div>
      </section>
      <section class="section">
        <div class="container">
          <img class="img" src="./imgs/Img_home_03.svg" />
          <div class="frame-1">
            <p class="keyword">Register</p>
            <div class="frame2">
              <h2 class="content">
                판매를 원하는
                <br />
                상품을 등록하세요
              </h2>
              <p class="content2">
                어떤 물건이든 판매하고 싶은 상품을
                <br />
                쉽게 등록하세요
              </p>
            </div>
          </div>
        </div>
      </section>
      <section id="banner-bottom">
        <div class="box2">
          <h1>
            믿을 수 있는
            <br />
            판다마켓 중고 거래
          </h1>
        </div>
      </section>
    </main>
    <footer>
      <div id="footerBox">
        <p class="footer-text1">©codeit - 2024</p>
        <div class="footerBox-middle">
          <a class="footer-text2" href="./privacy.html">Privacy Policy</a>
          <a class="footer-text2" href="./faq.html">FAQ</a>
        </div>
        <div class="footerBox-end">
          <a href="https://www.facebook.com/login.php/?lang=ko" target="_blank">
            <img class="icon" src="./imgs/ic_facebook.svg" alt="facebook" />
          </a>
          <a href="https://x.com/" target="_blank">
            <img class="icon" src="./imgs/ic_twitter.svg" alt="twitter" />
          </a>
          <a href="https://www.youtube.com/" target="_blank">
            <img class="icon" src="./imgs/ic_youtube.svg" alt="youtube" />
          </a>
          <a href="https://www.instagram.com/?hl=ko" target="_blank">
            <img class="icon" src="./imgs/ic_instagram.svg" alt="instagram" />
          </a>
        </div>
      </div>
    </footer>
