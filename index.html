<!DOCTYPE html>
<html lang="ko">
  <head>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓</title>
    <link rel="stylesheet" href="./reset.css" />
    <link rel="stylesheet" href="./style.css" />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
  </head>
  <body>
    <header>
      <a class="headerLogo" href="/">
        <img src="./img/logo.svg" alt="판다마켓 로고" />
        <h1 class="srOnly">판다마켓 메인 페이지</h1>
      </a>
      <a class="loginBtn" href="./login.html">로그인</a>
    </header>

    <main>
      <section id="hero">
        <div class="heroContainer">
          <h2>
            일상의 모든 물건을
            <br />
            거래해 보세요
          </h2>
          <a class="itemBtn" href="./items.html">구경하러 가기</a>
        </div>
      </section>

      <section id="feature">
        <!-- 핫 아이템 섹션 -->
        <div class="featureItem">
          <div class="imgBox">
            <img src="./img/hot_item.png" alt="인기 상품 예시 이미지" />
          </div>
          <div class="textBox">
            <a class="subTitle">Hot item</a>
            <h2>
              인기 상품을
              <br />
              확인해 보세요
            </h2>
            <h3>
              가장 HOT한 중고거래 물품을
              <br />
              판다 마켓에서 확인해 보세요
            </h3>
          </div>
        </div>

        <!-- 서치 섹션 -->
        <div class="featureItem">
          <div class="imgBox">
            <img src="./img/search.png" alt="검색 예시 이미지" />
          </div>
          <div class="textBox">
            <a class="subTitle">Search</a>
            <h2>
              구매를 원하는
              <br />
              상품을 검색하세요
            </h2>
            <h3>
              구매하고 싶은 물품은 검색에서
              <br />
              쉽게 찾아보세요
            </h3>
          </div>
        </div>

        <!-- 레지스터 섹션 -->
        <div class="featureItem">
          <div class="imgBox">
            <img src="./img/register.png" alt="레지스터 예시 이미지" />
          </div>
          <div class="textBox">
            <a class="subTitle">Register</a>
            <h2>
              판매를 원하는
              <br />
              상품을 등록하세요
            </h2>
            <h3>
              어떤 물건이든 판매하고 싶은 상품을
              <br />
              쉽게 등록하세요
            </h3>
            <br />
          </div>
        </div>
      </section>

      <!-- bottom 배너 섹션 -->
      <section id="bottom">
        <div class="bottomContainer">
          <h2>
            믿을 수 있는
            <br />
            판다마켓 중고거래
          </h2>
        </div>
      </section>
    </main>
    <footer>
      <div id="footer">
        <div id="footerLeft">
          <a>@codeit - 2024</a>
        </div>
        <div id="footerCenter">
          <a href="./privacy.html">Privacy Policy</a>
          <a href="./faq.html">FAQ</a>
        </div>
        <div id="snsIcon">
          <a href="https://www.facebook.com/">
            <img src="./img/ic_facebook.png" alt="페이스북 바로가기" />
          </a>
          <a href="https://x.com/">
            <img src="./img/ic_twitter.png" alt="트위터(현재 x) 바로가기" />
          </a>
          <a href="https://www.youtube.com/">
            <img src="./img/ic_youtube.png" alt="유튜브 바로가기" />
          </a>
          <a href="https://www.instagram.com/">
            <img src="./img/ic_instagram.png" alt="인스타그램 바로가기" />
          </a>
        </div>
      </div>
    </footer>
  </body>
</html>
