<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓</title>
    <link rel="stylesheet" href="./styles/reset.css" />
    <link rel="stylesheet" href="./styles/style.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/pretendard@latest/dist/web/static/pretendard.css"
    />
  </head>
  <body>
    <header>
      <a href="/">
        <img src="/images/pandalogo.svg" />
      </a>
      <a class="button login-button" href="/login.html">로그인</a>
    </header>

    <main>
      <section id="hero" class="hero-banner">
        <div class="inner">
          <h1>
            일상의 모든 물건을
            <br />
            거래해 보세요
          </h1>
          <a class="button hero-button" href="./items.html">구경하러 가기</a>
        </div>
      </section>

      <section id="features">
        <div class="inner">
          <div class="feature">
            <img src="./images/img1.png" alt="인기아이템" width="50%" />
            <div class="feature-content">
              <h2>Hot item</h2>
              <h1>
                인기 상품을
                <br />
                확인해 보세요
              </h1>
              <p>
                가장 HOT한 중고거래 물품을
                <br />
                판다 마켓에서 확인해 보세요
              </p>
            </div>
          </div>
        </div>
        <div class="inner">
          <div class="feature">
            <div class="feature-content">
              <h2>Search</h2>
              <h1>
                구매를 원하는
                <br />
                상품을 검색하세요
              </h1>
              <p>
                가장 HOT한 중고거래 물품을
                <br />
                판다 마켓에서 확인해 보세요
              </p>
            </div>
            <img src="./images/img2.png" alt="상품 검색 이미지" width="50%" />
          </div>
        </div>
        <div class="inner">
          <div class="feature">
            <img
              src="./images/img3.png"
              alt="판매 원하는 상품 등록 이미지"
              width="50%"
            />
            <div class="feature-content">
              <h2>Register</h2>
              <h1>
                판매를 원하는
                <br />
                상품을 등록하세요
              </h1>
              <p>
                어떤 물건이든 판매하고 싶은 상품을
                <br />
                쉽게 등록하세요
              </p>
            </div>
          </div>
        </div>
      </section>
      <section id="bottom" class="bottom-banner">
        <div class="inner">
          <h1>
            믿을 수 있는
            <br />
            판다마켓 중고거래
          </h1>
        </div>
      </section>
    </main>

    <footer></footer>
  </body>
</html>
