<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓</title>
    <link rel="stylesheet" href="reset.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <a href="/">
        <img src="/imgs/logo.svg" alt="판다마켓 로고" />
      </a>
      <a class="login-btn" href="/login.html">로그인</a>
    </header>
    <main>
      <section id="hero">
        <div class="container">
          <h1>
            일상의 모든 물건을
            <br />
            거래해 보세요
          </h1>
          <a href="/items.html">구경하러 가기</a>
        </div>
        <img src="/imgs/Img_home_top.png" alt="hero 로고" />
      </section>
      <section class="hot-item">
        <div class="backclr">
          <img
            class="sec1-img"
            src="/imgs/Img_home_01.png"
            alt="핫아이템 로고"
          />
          <div>
            <p id="category">Hot item</p>
            <h1>
              인기 상품을
              <br />
              확인해 보세요
            </h1>
            <p>
              가장 HOT한 중고거래 물품을
              <br />
              판다 마켓에서 확인해 보세요
            </p>
          </div>
        </div>
      </section>
      <section class="search">
        <div class="backclr">
          <div>
            <p id="category">Search</p>
            <h1>
              구매를 원하는
              <br />
              상품을 검색하세요
            </h1>
            <p>
              구매하고 싶은 물품은 검색해서
              <br />
              쉽게 찾아보세요
            </p>
          </div>
          <img class="sec2-img" src="/imgs/Img_home_02.png" alt="검색 로고" />
        </div>
      </section>
      <section class="register">
        <div class="backclr">
          <img class="sec3-img" src="/imgs/Img_home_03.png" alt="등록 로고" />
          <div>
            <p id="category">Register</p>
            <h1>
              판매를 원하는
              <br />
              상품을 등록하세요
            </h1>
            <p>
              어떤 물건이든 판매하고 싶은 상품을
              <br />
              쉽게 등록하세요
            </p>
          </div>
        </div>
      </section>
      <div class="duqor"></div>
      <section class="bottom-hero">
        <div class="container">
          <h1>
            믿을 수 있는
            <br />
            판다마켓 중고 거래
          </h1>
          <img src="/imgs/Img_home_bottom.png" alt="" />
        </div>
      </section>
    </main>
    <footer class="footer">
      <div class="csa">
        <p>©codeit - 2024</p>
        <div class="faqgap">
          <a href="/privacy.html">Privacy Policy</a>
          <a href="/faq.html">FAQ</a>
        </div>
        <div class="footer-img">
          <a href="https://www.facebook.com/">
            <img src="/imgs/ic_facebook.svg" alt="페이스북 로고" />
          </a>
          <a href="https://x.com/">
            <img src="/imgs/ic_twitter.svg" alt="트위터 로고" />
          </a>
          <a href="https://www.youtube.com/">
            <img src="/imgs/ic_youtube.svg" alt="유튜브 로고" />
          </a>
          <a href="https://about.instagram.com/">
            <img src="/imgs/ic_instagram.svg" alt="인스타그램 로고" />
          </a>
        </div>
      </div>
    </footer>
  </body>
</html>
