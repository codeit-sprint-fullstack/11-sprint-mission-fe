<!DOCTYPE html>
<html lang="ko">
  <head>
    <!-- Google tag (gtag.js) -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-EZD15B2SM6"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag('js', new Date());

      gtag('config', 'G-EZD15B2SM6');
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>login</title>
    <link rel="stylesheet" href="./styles/reset.css" />
    <link rel="stylesheet" href="/styles/login-style.css" />
    <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/pretendard@latest/dist/web/static/pretendard.css">
  </head>
  <body>
    <div id="layout">
      <header class="title">
        <a href="/" alt="클릭시 홈으로 가기">
          <img src="/images/pandalogo.svg" alt="판다마켓 로고" />
        </a>
      </header>
      <main>
        <form>
          <div class="set1">
            <label>
              이메일
              <input
                name="email"
                type="email"
                placeholder="이메일을 입력해주세요"
              />
            </label>
          </div>
          <div class="set2">
            <label>
              비밀번호
              <input
                name="password"
                type="password"
                placeholder="비밀번호를 입력해주세요"
              />
            </label>
          </div>

          <button>로그인</button>
        </form>
        <section class="social-login">
          <div class="inner">
            <h2>간편 로그인하기</h2>
            <div class="social-login-icon">
              <a href="https://www.google.com/" alt="구글 사이트로 이동">
                <img src="./images/google.png" alt="구글 로그인" />
              </a>
              <a
                href="https://www.kakaocorp.com/page/"
                alt="카카오 사이트로 이동"
              >
                <img src="./images/kakaotalk.png" alt="카카오톡 로그인" />
              </a>
            </div>
          </div>
        </section>
      </main>
      <footer>
        <p>
          판다마켓이 처음이신가요?
          <a href="./signup.html">회원가입</a>
        </p>
      </footer>
    </div>
  </body>
</html>
