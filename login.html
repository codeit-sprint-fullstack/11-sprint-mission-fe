<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>로그인 페이지</title>
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <link rel="stylesheet" href="/login_signup_style.css" />
    <link rel="icon" href="/images/icon.svg" />
  </head>

  <body>
    <header>
      <a href="#">
        <img src="/images/logo.svg" alt="판다마켓 로고" />
      </a>
    </header>

    <main>
      <!-- 정보 입력 영역 -->
      <div class="login-form">
        <form id="insert-info">
          <!-- 이메일 입력 -->
          <div class="insert-email">
            <label for="useremail">이메일</label>
            <input
              id="useremail"
              name="useremail"
              type="email"
              placeholder="이메일을 입력해주세요"
            />
          </div>
          <!-- 비밀번호 입력 -->
          <div class="insert-pwd">
            <label for="password">비밀번호</label>
            <div class="pwd-privacy">
              <input
                id="password"
                name="password"
                type="password"
                placeholder="비밀번호를 입력해주세요"
              />
              <img
                id="visible-button"
                src="/images/btn_visibility_off_24px.png"
                alt="비밀번호 보기 버튼"
              />
            </div>
          </div>
          <!-- 로그인 버튼 -->
          <button class="login-button">로그인</button>
        </form>
      </div>

      <div class="easy-login">
        간편 로그인하기
        <div class="icons">
          <a href="https://www.google.com/" class="social-icon">
            <img src="/images/Component 2@2x.png" alt="구글 로그인" />
          </a>
          <a href="https://www.kakaocorp.com/page/" class="social-icon">
            <img src="/images/Component 3@2x.png" alt="카카오 로그인" />
          </a>
        </div>
      </div>

      <div class="signup-link">
        판다마켓이 처음이신가요?
        <a href="/signup.html">회원가입</a>
      </div>
    </main>
  </body>
</html>
