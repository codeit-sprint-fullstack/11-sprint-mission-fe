<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓_로그인</title>
    <link rel="stylesheet" href="./reset.css" />
    <link rel="stylesheet" href="./login.css" />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
  </head>
  <body>
    <div class="loginContainer">
      <header>
        <!------ 페이지 로고 ------>
        <div class="loginLogo">
          <a href="./">
            <img src="./img/logo.svg" alt="판다마켓 로고" />
            <h1 class="srOnly">판다마켓 로그인 페이지</h1>
          </a>
        </div>
      </header>

      <main>
        <!------ 이메일 -------->
        <div class="inputGroup">
          <label for="email" class="inputLabel">이메일</label>

          <input
            type="email"
            id="email"
            class="inputBox"
            placeholder="이메일를 입력해주세요"
          />
        </div>
        <!------- 비밀번호 --------->
        <div class="inputGroup">
          <label for="password" class="inputLabel">비밀번호</label>

          <input
            type="password"
            id="password"
            class="inputBox"
            placeholder="비밀번호를 입력해주세요"
          />
          <!----- 비밀번호 박스안에 눈 ------->
          <a class="loginEyes" href="./img/login_eyes.png"></a>
        </div>

        <!------- 로그인 버튼 ------>
        <button class="loginBtn">로그인</button>

        <!----- 간편 로그인(소셜 로그인) ----->
        <div class="socialBox">
          <span class="socialText">간편 로그인하기</span>
          <div class="socialIcon">
            <a
              href="https://www.google.com/"
              target="_blank"
              class="socialIcon"
            >
              <img src="./img/ic_google.png" alt="구글 로그인" />
            </a>
            <a href="https://www.kakao.com/" target="_blank" class="socialIcon">
              <img src="./img/ic_kakao.png" alt="카카오 로그인" />
            </a>
          </div>
        </div>

        <!------ 회원가입 이동 ------->
        <div class="signup">
          <span>판다마켓이 처음이신가요?</span>
          <a href="./signup.html">회원가입</a>
        </div>
      </main>
    </div>
  </body>
</html>
