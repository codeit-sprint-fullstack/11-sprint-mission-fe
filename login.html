<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
    <title>로그인</title>
    <link rel="icon" type="image/logo/fabicon.ico" />

    <link rel="stylesheet" href="/styles/reset.css">    
    <link rel="stylesheet" href="/styles/global.css">
    <link rel="stylesheet" href="/styles/login.css"> 
</head>
<body>
    <header>
      <a href="/"><img src="images/logo/panda-market-logo.png" 
         alt="판다마켓홈" id="logoImage"width="153"></a>  
    </header>  
    <!-- <h1 class="login-title">로그인</h1> -->
    <form>
        <label for id="username">이메일</label>
        <input id="username" name="username" placeholder="이메일을 입력해주세요"/>
        <label for id="password">비밀번호</label>
        <div class="input-wrapper" background-color="blue">
            <input id="password" name="password" type="password" placeholder="비밀번호를 입력해주세요"/>
            <img src="images/home/eye-off-icon.svg" class="input-icon" alt="비밀번호숨기기아이콘" width="20" />
        </div>

        <button type="submit"> 로그인</button>
        <div class="wrapper">
            <div class="simple-login">
                <h2 style="font-size:12px">간편로그인하기</h2>
                <div class="simple-icon-align">
                    <!-- <h2>간편로그인하기</h2> -->
                    <a 
                    href="https://www.google.com/"
                    target="_blank"
                    rel="noopener noreferrer"
                    ><img src="images/social/google-logo.svg" alt="구글" width="20"
                    /></a>
                    <a href="https://www.kakaocorp.com/page/" target="_blank" rel="noopener noreferrer"
                    ><img src="images/social/kakao-talk-log.png" alt="카카오톡" width="20"
                    /></a>
                </div>
            </div>
            <br/>
            <div class="heading-wrap">
             <h2>판다마켓이 처음이신가요?</h2>
            <a href="signup.html" class="button link-button"
                style="font-size:12px;text-decoration:underline">회원가입</a>
            </div>
        </div>

       
    </form>
</body>
</html>
