<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>로그인</title>
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <link rel="stylesheet" href="./styles/reset.css" />
    <link rel="stylesheet" href="./styles/auth.css" />
  </head>
  <body>
    <section class="auth-section">
      <a href="/" class="logo-link">
        <img src="./imgs/logo.svg" alt="판다마켓 로고" />
        <h1 class="sr-only">판다마켓 로그인 페이지</h1>
      </a>
      <form class="auth-form">
        <div class="input-group">
          <label for="email">이메일</label>
          <input
            type="email"
            name="email"
            id="email"
            placeholder="이메일을 입력해주세요."
          />
        </div>
        <div class="input-group">
          <label for="password">비밀번호</label>
            <input
              type="password"
              name="pssword"
              id="password"
              placeholder="비밀번호를 입력해주세요."
            />
          </div>
        </div>
        <button class="submit-btn" type="submit">로그인</button>

        <div class="social-login">
          <p>간편 로그인 하기</p>
          <nav aria-label="소셜 로그인" class="social-login-buttons">
            <a
              href="https//www.google.com/"
              class="social-login-button"
              target="_blank"
              rel="noopener noreferrer"
            >
              <img src="./imgs/auth/Component 2.svg" alt="구글 로그인" />
            </a>
            <a
              href="https//www.kakaocorp.com/pape/"
              class="social-login-button"
              target="_blank"
              rel="noopener noreferrer"
            >
              <img src="./imgs/auth/Component 3.svg" alt="카카오 로그인" />
            </a>
          </nav>
        </div>
        <p class="link-text">
          판다마켓이 처음이신가요?
          <a href="/singup.html">회원가입</a>
        </p>
      </form>
    </section>
  </body>
</html>
