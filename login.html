<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>로그인</title>
    <link rel="stylesheet" href="reset.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body id="login-body">
    <main id="login-main">
      <a href="/">
        <img class="login-logo" src="./imgs/logo.svg" alt="판다마켓 로고" />
      </a>
      <section class="login-container">
        <form>
          <div class="form-group">
            <div class="form-group-item">
              <label class="login-lable" for="email">이메일</label>
              <input
                class="login-input"
                type="email"
                id="email"
                name="email"
                placeholder="이메일을 입력해주세요"
              />
            </div>
            <div class="form-group-item">
              <label class="login-lable" for="password">비밀번호</label>
              <input
                class="login-input"
                type="password"
                id="password"
                name="password"
                placeholder="비밀번호를 입력해주세요"
              />
            </div>
          </div>
          <button class="login-button" type="submit">로그인</button>
        </form>
        <div class="simple-login-container">
          <p>간편 로그인하기</p>
          <div class="simple-login-icons">
            <a href="https://www.google.com/" target="_blank">
              <img
                class="simple-login-icon"
                src="./imgs/Google.png"
                alt="구글"
              />
            </a>
            <a href="https://www.kakaocorp.com/page/" target="_blank">
              <img
                class="simple-login-icon"
                src="./imgs/kakaotalk.png"
                alt="카카오톡"
              />
            </a>
          </div>
        </div>
        <div class="move-signUp-container">
          <p class="firstUsePM">판다마켓이 처음이신가요?</p>
          <a class="move-signUp-button" href="./signup.html">회원가입</a>
        </div>
      </section>
    </main>
  </body>
</html>
