<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./reset.css" />
    <link rel="stylesheet" href="./login.css" />
    <link rel="icon" href="/images/favicon.svg" />
    <title>판다마켓 로그인</title>
  </head>
  <body>
    <main>
      <section class="logo">
        <a href="./"><img src="./images/login_logo.png" /></a>
      </section>
      <form>
        <div class="input_container">
          <label for="login-email">이메일</label>
          <input
            type="email"
            id="login-email"
            name="email"
            placeholder="이메일을 입력해주세요"
          />
        </div>
        <div class="input_container">
          <label for="login-password">비밀번호</label>
          <input
            type="password"
            id="login-password"
            name="password"
            placeholder="비밀번호를 입력해주세요"
          />
        </div>

        <button type="submit" class="login_button">로그인</button>
      </form>

      <section class="simple_login_container">
        <p>간편 로그인하기</p>

        <div class="simple_login">
          <a href="https://www.google.com/" target="_blank">
            <img src="./images/login_google.png" />
          </a>
          <a href="https://www.kakaocorp.com/page/" target="_blank">
            <img src="./images/login_kakotalk.png" />
          </a>
        </div>
      </section>
      <section>
        <p class="signup_text">
          판다마켓이 처음이신가요?
          <span><a href="./signup.html">회원가입</a></span>
        </p>
      </section>
    </main>
  </body>
</html>
