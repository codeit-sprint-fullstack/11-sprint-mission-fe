<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓</title>
    <link rel="stylesheet" href="/style.css" />
    <link rel="icon" href="/images/panda-icon.svg" />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
  </head>

  <body>
    <header>
      <a href="/">
        <img src="/images/pandamarket-logo.svg" alt="판다마켓 로고" />
      </a>
      <a href="login.html" class="button">로그인</a>
    </header>

    <main>
      <siction id="hero" class="banner">
        <div class="slogan">
          <h2>
            일상의 모든 물건을
            <br />
            거래해 보세요
          </h2>
          <a href="/items.html" class="button round">구매하러 가기</a>
        </div>
        <img src="/images/banner/top-banner.svg" alt="상단 배너" />
      </siction>

      <section class="container">
        <div class="content">
          <img src="/images/content/Img_home_01.svg" alt="인기 상품" />
          <div class="text">
            <span>Hot item</span>
            <h2>인기 상품을<br>확인해 보세요</h2>
            <p>가장 HOT한 중고거래 물품을 판다마켓에서 확인해 보세요</p>
          </div>          
        </div>

        <div class="content">
          <div class="text left">
            <span>Search</span>
            <h2>구매를 원하는<br>상품을 검색하세요</h2>
            <p>구매하고 싶은 물품은 검색해서 쉽게 찾아보세요</p>
          </div>
          <img src="/images/content/Img_home_02.svg" alt="상품 검색" />
        </div>

        <div class="content">
          <img src="/images/content/Img_home_03.svg" alt="상품 등록" />
          <div class="text">
            <span>Register</span>
            <h2>판매를 원하는<br>상품을 등록하세요</h2>
            <p>어떤 물건이든 판매하고 싶은 상품을 쉽게 등록하세요</p>
          </div>
        </div>
      </section>

      <section class="banner">
        <div class="slogan">
          <h2>
            믿을 수 있는
            <br />
            판다마켓 중고거래
          </h2>
          
        </div>
        <img src="/images/banner/bottom-banner.svg" alt="하단 배너" />
      </section>
    </main>

    <footer>
      <div>©codeit - 2024</div>
      <div class="footer-links">
        <a href="privacy.html">Privacy Policy</a>
        <a href="faq.html">FAQ</a>
      </div>
      <div class="sns-icons">
        <!-- 링크 새 창으로 열 때 noopener noreferrer 보안 필요 -->
        <a
          href="https://www.facebook.com/"
          target="_blank"
          rel="noopener noreferrer"
        >
          <img src="/images/icons/ic_facebook.svg" alt="페이스북""/>
        </a>
        <a href="https://x.com/" target="_blank" rel="noopener noreferrer">
          <img src="/images/icons/ic_twitter.svg" alt="트위터" />
        </a>
        <a
          href="https://www.youtube.com/"
          target="_blank"
          rel="noopener noreferrer"
        >
          <img src="/images/icons/ic_youtube.svg" alt="유튜브" />
        </a>
        <a
          href="https://www.instagram.com/"
          target="_blank"
          rel="noopener noreferrer"
        >
          <img src="/images/icons/ic_instagram.svg" alt="인스타그램" />
        </a>
      </div>
    </footer>
  </body>
</html>
