<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>회원가입</title>
    <link rel="stylesheet" href="/styles/reset.css">    
    <link rel="stylesheet" href="/styles/global.css">
    <link rel="stylesheet" href="/styles/login.css"> 
  </head>
  <body>
    <header>
      <a href="/"><img src="images/logo/panda-market-logo.png"  alt="판다마켓홈" id="logoImage"width="153"></a>  
    </header>  

    <form>
      <label for="userId">이메일</label>
      <input id="username" name="username" type="email" placeholder="이메일을 입력해주세요">
      <label for="nickName">닉네임</label>
      <input id="nickName" name="email" placeholder="닉네임을 입력해주세요">
      <label for="password">비밀번호</label>
        <div class="input-wrapper" background-color="blue">
            <input id="password" name="password" type="password" placeholder="비밀번호를 입력해주세요"/>
            <img src="images/home/eye-off-icon.svg" class="input-icon" alt="비밀번호숨기기아이콘" width="20" />
        </div>
      <label for="password-repeat">비밀번호 확인</label>
        <div class="input-wrapper" background-color="blue">
            <input id="password-repeat" name="password-repeat" type="password" placeholder="비밀번호를 다시 한 번 입력해주세요">
            <img src="images/home/eye-off-icon.svg" class="input-icon" alt="비밀번호숨기기아이콘" width="20" />
        </div>

        <button  type="signup-sumit">회원가입</button>
    
        <div class="wrapper">
            <div class="simple-login">
                <h2 style="font-size:12px">간편로그인하기</h2>
                <div class="simple-icon-align">
                    <!-- <h2>간편로그인하기</h2> -->
                    <a 
                    href="https://www.google.com/"
                    target="_blank"
                    rel="noopener noreferrer"
                    ><img src="images/social/google-logo.svg" alt="구글" width="20"
                    /></a>
                    <a href="https://www.kakaocorp.com/page/" target="_blank" rel="noopener noreferrer"
                    ><img src="images/social/kakao-talk-log.png" alt="카카오톡" width="20"
                    /></a>
                </div>
            </div>    
            <br/>
            <div class="heading-wrap">
             <h2>이미 회원이신가요?</h2>
            <a href="login.html" class="button link-button"
                style="font-size:12px;text-decoration:underline">로그인</a>
            </div>
        </div>

    </form>           
  </body>
</html>
