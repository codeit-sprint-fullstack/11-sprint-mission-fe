<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>login</title>
    <link rel="stylesheet" href="./styles/reset.css" />
    <link rel="stylesheet" href="/styles/signup-style.css" />
    <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/pretendard@latest/dist/web/static/pretendard.css"
  </head>
  <body>
    <div id="layout">
      <header class="title">
        <a href="/" alt="클릭시 홈으로 가기">
          <img src="/images/pandalogo.svg" alt="판다마켓 로고" />
        </a>
      </header>
      <main>
        <form>
          <div class="set1">
            <label>
              이메일
              <input
                name="email"
                type="email"
                placeholder="이메일을 입력해주세요"
              />
            </label>
          </div>
          <div class="set2">
            <label>
              닉네임
              <input
                name="name"
                type="text"
                placeholder="닉네임을 입력해주세요"
              />
            </label>
          </div>
          <div class="set3">
            <label>
              비밀번호
              <div class="pw-group">
                <input
                  name="password"
                  type="password"
                  placeholder="비밀번호를 입력해주세요"
                />
                <img class="pw-eye" src="./images/eyebutton.png" alt="비밀번호 표시 아이콘" />
              </div>
            </label>
          </div>
          <div class="set4">
            <label>
              비밀번호 확인
              <div class="pw-group">
                <input
                  name="password"
                  type="password"
                  placeholder="비밀번호를 다시 한 번 입력해주세요"
                />
                <img class="pw-eye" src="./images/eyebutton.png" alt="비밀번호 표시 아이콘" />
              </div>
                
            </label>
          </div>

          <button>회원가입</button>
        </form>
        <section class="social-login">
          <div class="inner">
            <h2>간편 로그인하기</h2>
            <div class="social-login-icon">
              <a href="https://www.google.com/" alt="구글 사이트로 이동">
                <img src="./images/google.png" alt="구글 로그인" />
              </a>
              <a
                href="https://www.kakaocorp.com/page/"
                alt="카카오 사이트로 이동"
              >
                <img src="./images/kakaotalk.png" alt="카카오톡 로그인" />
              </a>
            </div>
          </div>
        </section>
      </main>
      <footer>
        <p>
          이미 회원이신가요?
          <a href="./login.html">로그인</a>
        </p>
      </footer>
    </div>
  </body>
</html>
