<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./reset.css" />
    <link rel="stylesheet" href="./login.css" />
    <link rel="icon" href="/images/favicon.svg" />
    <title>판다마켓 회원가입</title>
  </head>
  <body>
    <main>
      <section class="logo">
        <a
          href="./
        "
        >
          <img src="./images/login_logo.png" />
        </a>
      </section>
      <form>
        <div class="input_container">
          <label for="signup-email">이메일</label>
          <input
            type="email"
            id="signup-email"
            name="signup-email"
            placeholder="이메일을 입력해주세요"
          />
        </div>
        <div class="input_container">
          <label for="signup-nickname">닉네임</label>
          <input
            type="text"
            id="signup-nickname"
            name="signup-nickname"
            placeholder="닉네임을 입력해주세요"
          />
        </div>
        <div class="input_container">
          <label for="signup-password">비밀번호</label>
          <input
            type="password"
            id="signup-password"
            name="signup-password"
            placeholder="비밀번호를 입력해주세요"
          />
        </div>
        <div class="input_container">
          <label for="check-password">비밀번호 확인</label>
          <input
            type="password"
            id="check-password"
            name="check-password"
            placeholder="비밀번호를 다시 한 번 입력해주세요"
          />
        </div>

        <button type="submit" class="login_button">회원가입</button>
      </form>

      <section class="simple_login_container">
        <p>간편 로그인하기</p>

        <div class="simple_login">
          <a href="https://www.google.com/" target="_blank">
            <img src="./images/login_google.png" />
          </a>
          <a href="https://www.kakaocorp.com/page/" target="_blank">
            <img src="./images/login_kakotalk.png" />
          </a>
        </div>
      </section>
      <section>
        <p class="signup_text">
          이미 회원이신가요?
          <span><a href="./login.html">로그인</a></span>
        </p>
      </section>
    </main>
  </body>
</html>
