<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>판다마켓-SIGNUP</title>
    <link rel="icon" href="images/favicon.ico" />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <link rel="stylesheet" href="/css/reset.css" />
    <link rel="stylesheet" href="/css/login.css" />
  </head>

  <body id="signup_page">
    <main>
      <a href="/">
        <img src="/images/Group 19.svg" alt="판다마켓 홈으로" id="logo"/ >
      </a>

      <div class="forms">
        <form>
          <div class="inputs">
            <label for="signup-email">이메일</label>
            <br />
            <input
              id="signup-email"
              name="email"
              type="email"
              placeholder="이메일을 입력해주세요"
              autocomplete="email"
            />
          </div>
          <div class="inputs">
            <label for="nickname">닉네임</label>
            <br />
            <input
              id="nickname"
              name="nickname"
              type="text"
              placeholder="닉네임을 입력해주세요"
              autocomplete="on"
            />
          </div>
          <div class="inputs">
            <label for="signup-password">비밀번호</label>
            <br />
            <input
              id="signup-password"
              name="password"
              type="password"
              placeholder="비밀번호를 입력해주세요"
            />
          </div>
          <div class="inputs">
            <label for="signup-password_repeat">비밀번호 확인</label>
            <br />
            <input
              id="signup-password_repeat"
              name="password_repeat"
              type="password"
              placeholder="비밀번호를 다시 한 번 입력해주세요"
            />
          </div>
        </form>
        <div class="login-button">회원가입</div>
      </div>

      <div class="easy-login">
        <h1>간편 로그인하기</h1>
        <div class="icons">
          <a href="https://www.google.com/">
            <img src="/images/icon/google.svg" alt="구글" target="_blank" />
          </a>
          <a href="https://www.kakaocorp.com/page/">
            <img
              src="/images/icon/kakaotalk.svg"
              alt="카카오톡"
              target="_blank"
            />
          </a>
        </div>
      </div>

      <div class="signup">
        이미 회원이신가요?
        <a href="/login.html">로그인</a>
      </div>
    </main>
  </body>
</html>
