<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>회원가입</title>
    <link rel="stylesheet" href="reset.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body id="signup-body">
    <main id="signup-main">
      <a href="/">
        <img class="signup-logo" src="./imgs/logo.svg" alt="판다마켓 로고" />
      </a>
      <div class="signup-container">
        <form class="signup-form-container">
          <section class="signup-section">
            <label class="signup-label" for="email">이메일</label>
            <input
              class="signup-input"
              type="email"
              id="email"
              name="email"
              placeholder="이메일을 입력해주세요"
            />
          </section>
          <section class="signup-section">
            <label class="signup-label" for="user-nickname">닉네임</label>
            <input
              class="signup-input"
              type="text"
              id="user-nickname"
              name="user-nickname"
              placeholder="닉네임을 입력해주세요"
            />
          </section>
          <section class="signup-section">
            <label class="signup-label" for="password">비밀번호</label>
            <input
              class="signup-input"
              type="password"
              id="password"
              name="password"
              placeholder="비밀번호를 입력해주세요"
            />
          </section>
          <section class="signup-section">
            <label class="signup-label" for="confirm-password">
              비밀번호 확인
            </label>
            <input
              class="signup-input"
              type="password"
              id="confirm-password"
              name="confirm-password"
              placeholder="비밀번호를 다시 한 번 입력해주세요"
            />
          </section>
          <button class="signup-button" type="submit">회원가입</button>
        </form>
        <div class="simple-login-container">
          <p>간편 로그인하기</p>
          <div class="simple-login-icons">
            <a href="https://www.google.com/" target="_blank">
              <img
                class="simple-login-icon"
                src="./imgs/Google.png"
                alt="구글"
              />
            </a>
            <a href="https://www.kakaocorp.com/page/" target="_blank">
              <img
                class="simple-login-icon"
                src="./imgs/kakaotalk.png"
                alt="카카오톡"
              />
            </a>
          </div>
        </div>
        <div class="move-signUp-container">
          <p class="firstUsePM">이미 회원이신가요?</p>
          <a class="move-signUp-button" href="./login.html">로그인</a>
        </div>
      </div>
    </main>
  </body>
</html>
