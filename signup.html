<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓 회원가입</title>
    <link rel="stylesheet" href="reset.css" />
    <link rel="stylesheet" href="signup-style.css" />
    <link rel="icon" href="imgs\favicon.ico" />
  </head>
  <body>
    <section class="signup-page">
      <a href="Index.html">
        <img id="logo" src="imgs\logo.svg" />
      </a>

      <div class="title">
        <label>
          <div>이메일</div>
          <input
            class="input"
            type="email"
            id="email"
            placeholder="이메일을 입력해주세요"
            required
          />
        </label>
      </div>

      <div class="title">
        <label>
          <div>닉네임</div>
          <input
            class="input"
            type="name"
            placeholder="닉네임을 입력해주세요"
          />
        </label>
      </div>

      <div class="title">
        <label>
          <div>비밀번호</div>
          <input
            class="input"
            type="password"
            placeholder="비밀번호를 입력해주세요"
            required
          />
        </label>
      </div>

      <div class="title">
        <label>
          <div>비밀번호 확인</div>
          <input
            class="input"
            type="password"
            placeholder="비밀번호를 다시 한 번 입력해주세요"
            required
          />
        </label>
      </div>

      <div class="signup-button">회원가입</div>

      <div id="easy-login">
        간편 로그인하기
        <div id="icon">
          <a href="https://www.google.com/">
            <img src="imgs\googleicon.png" />
          </a>
          <a href="https://www.kakaocorp.com/page/">
            <img src="imgs\kakaoicon.png" />
          </a>
        </div>
      </div>

      <div id="already">
        이미 회원이신가요?
        <a id="al-login" href="login.html">로그인</a>
      </div>
    </section>
  </body>
</html>
