<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓 - 로그인</title>
    <link rel="icon" href="images/logo/favicon.ico" />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <link rel="stylesheet" href="styles/reset.css" />
    <link rel="stylesheet" href="styles/global.css" />
    <link rel="stylesheet" href="/styles/login.css" />
  </head>

  <body>
    <main>
      <div class="wrapper loginform">
        <a href="/">
          <img
            src="images/logo/panda-market-logo.png"
            alt="판다마켓 홈"
            width="247"
          />
        </a>
        <form class="login">
          <div class="input-container">
            <label>이메일</label>
            <input
              name="useremail"
              type="text"
              placeholder="이메일을 입력해주세요"
            />
          </div>
          <div class="input-container">
            <label>닉네임</label>
            <input
              name="usernickname"
              type="text"
              placeholder="닉네임을 입력해주세요"
            />
          </div>
          <div class="input-container">
            <label>비밀번호</label>
            <input
              name="userpassword"
              type="password"
              placeholder="비밀번호를 입력해주세요 "
            />
            <div class="eyes">
              <i class="fa-regular fa-eye-slash"></i>
            </div>
          </div>
          <div class="input-container">
            <label>비밀번호 확인</label>
            <input
              name="userpassword"
              type="password"
              placeholder="비밀번호를 다시 한 번 입력해주세요 "
            />
            <div class="eyes">
              <i class="fa-regular fa-eye-slash"></i>
            </div>
          </div>
          <button class="button" value="disabled">로그인</button>
        </form>
        <div class="simplelogin-container">
          <h3>간편 로그인하기</h3>
          <div id="socialLogin">
            <a
              href="https://www.google.com/"
              target="_blank"
              rel="noopener noreferrer"
            >
              <img src="/images/social/google-logo.svg" alt="구글" width="42" />
            </a>
            <a
              href="https://www.kakaocorp.com/page/"
              target="_blank"
              rel="noopener noreferrer"
            >
              <img
                src="/images/social/kakaotalk-logo.svg.svg"
                alt="카카오톡"
                width="42"
              />
            </a>
          </div>
        </div>
        <p class="loginMore">
          이미 회원이신가요?
          <a href="/login.html">로그인</a>
        </p>
      </div>
    </main>
  </body>
</html>
