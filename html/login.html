<!DOCTYPE html>
<html lang="ko">
  <head>
    <!-- meta -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- title -->
    <title>판다마켓</title>

    <!-- favicon -->
    <link rel="icon" href="/assets/icons/favicon.svg" />

    <!-- CSS link -->
    <link rel="stylesheet" href="/css/reset.css" />
    <link rel="stylesheet" href="/css/variables.css" />
    <link rel="stylesheet" href="/css/global.css" />
    <link rel="stylesheet" href="/css/pages/login.css" />

    <!-- font: Pretendard -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
  </head>

  <body>
    <section class="login__section">
      <div class="login__logo">
        <a href="/html/index.html">
          <img src="/assets/icons/login-logo.svg" alt="로그인 로고" />
        </a>
      </div>

      <div class="login__form">
        <form>
          <div class="login__email">
            <label for="input__label">이메일</label>
            <input
              id="input__email"
              type="email"
              placeholder="이메일을 입력해주세요"
            />
          </div>

          <div class="login__password">
            <div>
              <label for="input__label">비밀번호</label>
              <input
                id="input__password"
                type="password"
                placeholder="비밀번호를 입력해주세요"
              />
              <!-- i태그 사용 고려 -->
              <img src="/assets/icons/eye-open.svg" alt="눈 모양 아이콘" />
            </div>
          </div>
          <button type="submit" class="submit-btn">로그인</button>
        </form>
      </div>

      <div class="login__social">
        <p>간편 로그인하기</p>
        <div class="social-buttons">
          <a
            href="https://www.google.com/"
            target="_blank"
          >
            <img src="/assets/icons/google.svg" />
          </a>
          <a
            href="https://www.kakaocorp.com/page/"
            target="_blank"
          >
            <img src="/assets/icons/kakao.svg" />
          </a>
        </div>
      </div>

      <div class="login__signup">
        <p>
          판다마켓이 처음이신가요?
          <a href="/html/signup.html">회원가입</a>
        </p>
      </div>
    </section>
  </body>
</html>
