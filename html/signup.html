<!DOCTYPE html>
<html lang="ko">
  <head>
    <!-- meta -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- title -->
    <title>판다마켓</title>

    <!-- favicon -->
    <link rel="icon" href="/assets/icons/favicon.svg" />

    <!-- CSS link -->
    <link rel="stylesheet" href="/css/reset.css" />
    <link rel="stylesheet" href="/css/variables.css" />
    <link rel="stylesheet" href="/css/global.css" />
    <link rel="stylesheet" href="/css/pages/signup.css" />

    <!-- font: Pretendard -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
  </head>

  <body>
    <section class="login__section">
      <div class="login__logo">
        <a href="/">
          <img src="/assets/icons/login-logo.svg" alt="로그인 로고" />
        </a>
      </div>

      <div class="login__box">
        <div class="login__form">
          <form>
            <div class="login__input">
              <label for="userEmail">이메일</label>
              <input id="userEmail" type="email" placeholder="이메일을 입력해주세요" />
            </div>

            <div class="login__input">
              <label for="userNickname">닉네임</label>
              <input id="userNickname" type="text" placeholder="닉네임을 입력해주세요" />
            </div>

            <div class="login__input input__password">
              <label for="userPassword">비밀번호</label>
              <input id="userPassword" type="password" placeholder="비밀번호를 입력해주세요" />
            </div>

            <div class="login__input input__password">
              <label for="confirmPassword">비밀번호 확인</label>
              <input id="confirmPassword" type="password" placeholder="비밀번호를 다시 한 번 입력해주세요" />
            </div>

            <button type="submit" class="submit-btn">회원가입</button>
          </form>
          <!-- </div> -->
        </div>

        <div class="login__social">
          <p>간편 로그인하기</p>
          <div class="social-buttons">
            <a href="https://www.google.com/" target="_blank">
              <img src="/assets/icons/google.svg" />
            </a>
            <a href="https://www.kakaocorp.com/page/" target="_blank">
              <img src="/assets/icons/kakao.svg" />
            </a>
          </div>
        </div>

        <div class="login__signup">
          <p>이미 회원이신가요?</p>
          <a href="/html/login.html">로그인</a>
        </div>
      </div>
    </section>
  </body>
</html>
