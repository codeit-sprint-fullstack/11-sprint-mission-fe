<!DOCTYPE html>
<html lang="ko">
  <head>
    <!-- meta -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- title -->
    <title>판다마켓</title>

    <!-- favicon -->
    <link rel="icon" href="/assets/icons/favicon.svg" />

    <!-- CSS link -->
    <link rel="stylesheet" href="/css/reset.css" />
    <link rel="stylesheet" href="/css/variables.css" />
    <link rel="stylesheet" href="/css/global.css" />
    <link rel="stylesheet" href="/css/main.css" />

    <!-- font: Pretendard -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
  </head>

  <body>
    <main class="login">
      <section class="login__logo">
        <a href="index.html">
          <img src="/assets/icons/login-logo.svg" alt="로그인 로고" />
        </a>
      </section>

      <section class="signup__form">
        <form>
          <div>
            <label for="input__email">이메일</label>
            <input id="input__email" type="email" placeholder="이메일을 입력해주세요" />
          </div>

          <div>
            <label for="input__password">닉네임</label>
            <input id="input__password" type="input" placeholder="닉네임을 입력해주세요" />
          </div>

          <div>
            <label for="input__email">비밀번호</label>
            <div>
              <input id="input__email" type="email" placeholder="비밀번호를 입력해주세요" />
              <!-- i태그 사용 고려 -->
              <img src="/assets/icons/eye-open.svg" alt="눈 모양 아이콘" />
            </div>
          </div>

          <div>
            <label for="input__email">비밀번호 확인</label>
            <input
              id="input__email"
              type="email"
              placeholder="비밀번호를 다시 한 번 입력해주세요"
            />
          </div>

          <button type="submit" class="btn-signup">회원가입</button>
        </form>
      </section>

      <section class="login__social">
        <div>
          <p>간편 로그인하기</p>
          <div class="social-buttons">
            <a href=""><img src="/assets/icons/google.svg" /></a>
            <a href=""><img src="/assets/icons/kakao.svg" /></a>
          </div>
        </div>
      </section>

      <section class="login__signup">
        <p>
          이미 회원이신가요?
          <a href="/html/login.html">로그인</a>
        </p>
      </section>
    </main>
  </body>
</html>
