<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/style/reset.css">
  <link rel="stylesheet" href="/style/style.css">
  <link 
  rel="stylesheet" 
  as="style" 
  crossorigin 
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <title>판다마켓</title>
</head>
<body>
  <!-- header -->
  <header> 
    <a class="button" href="/">
      <img id="logo" src="/imgs/logo.svg" alt="판다마켓 로고">
    </a>
    <a class="login" href="/html/login.html">로그인</a>
    </div>
  </header>
  <!-- main -->
  <main>
  <!-- main-article -->
    <article>
      <div class="position">
        <div class="title-content">
          <div class="big-word" id="article-word">일상의 모든 물건을<br> 거래해 보세요</div>
          <a id="middle-button" class="button" href="/html/items.html">구경하러 가기</a>
        </div>
        <img class="panda-photo" src="/imgs/Img_home_top.png" alt="구경하러 가요">
      </div>
    </article>
  <!--main-section 1-->
  <div class="section-flex">
    <section> <!--인기상품-->
      <div class="flexs">
        <img class="img" src="/imgs/hot-item.png" alt="인기 상품">
        <div class="word-box">
          <a class="point-keyWord">Hot item</a>
          <a class="big-word">인기 상품을<br> 확인해 보세요</a>
          <a >가장 HOT한 중고거래 물품을<br>다 마켓에서 확인해 보세요</a>
        </div>
      </div>
    </section>
  <!--main-section 2-->
    <section> <!--상품 검색-->
      <div id="flex-reverse" class="flexs">
          <img class="img" src="/imgs/search.png" alt="상품을 검색하세요">
        <div id="word-reverse" class="word-box">
          <a class="point-keyWord">Search</a>
          <a class="big-word">구매를 원하는<br> 상품을 검색하세요</a>
          <a >구매하고 싶은 물품은 검색해서<br>쉽게 찾아보세요</a>
        </div>
      </div>
    </section>
  <!--main-section 3-->
    <section> <!--상품등록-->
      <div class="flexs">
        <img class="img" src="/imgs/register.png" alt="상품을 등록하세요">
          <div class="word-box">
            <a class="point-keyWord">Register</a>
            <a class="big-word">판매를 원하는<br> 상품을 등록하세요</a>
            <a >어떤 물건이든 판매하고 싶은 상품을<br>쉽게 등록하세요</a>
          </div>
      </div>  
    </section>
  </div>
  <!--bottom article-->
    <article id="bottom-box"> 
      <div id="bottom-position" class="position">
        <a class="big-word" id="last-big-word">믿을 수 있는<br> 판다마켓 중고거래</a>
        <img class="panda2-photo" src="/imgs/Img_home_bottom.png" alt="두마리의 판다">
      </div>
    </article>
  </main>
  <!-- footer -->
  <footer>
    <a id="codeit">©codeit - 2024</a>
  <!-- FOOTER BOTTOM CENTER -->
    <div id="bottom-center">
      <a class="bottom-font" href="/html/privacy.html">Privacy Policy</a>
      <a class="bottom-font" href="/html/faq.html">FAQ</a>
    </div>
  <!-- sns 로고 -->
    <div class="sns">
      <a class="button" href="https://www.facebook.com/?locale=ko_KR" target="_blank">
        <img src="/imgs/ic_facebook.svg" alt="페이스북">
      </a>
      <a class="button" href="https://x.com/?lang=ko" target="_blank">
        <img src="/imgs/ic_twitter.svg" alt="트위터">
      </a>
      <a class="button" href="https://www.youtube.com/?hl=ko&gl=KR&app=desktop" target="_blank">
        <img src="/imgs/ic_youtube.svg" alt="유투브">
      </a>      
      <a class="button" href="https://www.instagram.com/" target="_blank">
        <img src="/imgs/ic_instagram.svg" alt="인스타그램">
      </a>  
    </div>         
  </footer>
</body>
</html>
