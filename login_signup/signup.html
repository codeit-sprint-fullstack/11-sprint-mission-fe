<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>회원가입 페이지</title>
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <link rel="stylesheet" href="/login_signup/login_signup_style.css" />
    <link rel="icon" href="/login_signup/images/panda-icon.svg" />
  </head>

  <body>
    <header>
      <a href="/main/index.html">
        <img
          src="/login_signup/images/pandamarket-logo.svg"
          alt="판다마켓 로고"
        />
      </a>
    </header>

    <main>
      <!-- 정보 입력 영역 -->
      <div class="signup-container">
        <form class="signup-wrapper">
          <!-- 이메일 입력 -->
          <div class="containers email-container">
            <label for="useremail">이메일</label>
            <input
              id="useremail"
              name="email"
              type="email"
              placeholder="이메일을 입력해주세요"
            />
            <span class="error-message"></span>
          </div>
          <!-- 닉네임 입력 -->
          <div class="containers nickname-container">
            <label for="usernickname">닉네임</label>
            <input
              id="usernickname"
              name="nickname"
              type="text"
              placeholder="닉네임을 입력해주세요"
            />
          </div>
          <!-- 비밀번호 입력 -->
          <div class="containers pwd-container">
            <label for="password">비밀번호</label>
            <div class="pwd-wrapper">
              <input
                id="password"
                name="password"
                type="password"
                placeholder="비밀번호를 입력해주세요"
              />
              <img
                class="btn-password-toggle"
                src="/login_signup/images/btn_visibility_off.png"
                alt="비밀번호 보기 버튼"
              />
            </div>
            <span class="error-message"></span>
          </div>
          <!-- 비밀번호 재입력 -->
          <div class="containers pwd-container">
            <label for="password-confirm">비밀번호 확인</label>
            <div class="pwd-wrapper">
              <input
                id="password-confirm"
                name="passwordConfirm"
                type="password"
                placeholder="비밀번호를 다시 한 번 입력해주세요"
              />
              <img
                class="btn-password-toggle"
                src="/login_signup/images/btn_visibility_off.png"
                alt="비밀번호 보기 버튼"
              />
            </div>
            <span class="error-message"></span>
          </div>
          <!-- 회원가입 버튼 -->
          <button class="signup-button" disabled>회원가입</button>
        </form>
      </div>

      <div class="social-login">
        간편 로그인하기
        <div class="icons">
          <a href="https://www.google.com/" class="social-icon">
            <img
              src="/login_signup/images/Component 2@2x.png"
              alt="구글 로그인"
            />
          </a>
          <a href="https://www.kakaocorp.com/page/" class="social-icon">
            <img
              src="/login_signup/images/Component 3@2x.png"
              alt="카카오 로그인"
            />
          </a>
        </div>
      </div>

      <div class="login-link">
        이미 회원이신가요?
        <a href="/login_signup/login.html">로그인</a>
      </div>
    </main>

    <script type="module" src="/login_signup/login_signup.js"></script>
  </body>
</html>
